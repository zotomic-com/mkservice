<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — own downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <nav class="topbar">
    <a href="index.html" class="logo-mini" style="text-decoration:none;color:var(--text)">own<span>dl</span> / admin</a>
    <div class="auth-area"><button id="signout-btn" class="btn text small-btn hidden">Sign out</button></div>
  </nav>

  <main class="wrap admin-wrap">
    <section id="denied" class="loader hidden">
      <div class="spinner"></div>
      <p>Checking your access…</p>
    </section>

    <section id="no-access" class="no-access hidden">
      <h2>🚫 Admin access required</h2>
      <p>Sign in with an account that has the <code>admin</code> role.</p>
      <a href="index.html" class="btn ghost">← Back to downloader</a>
    </section>

    <section id="panel" class="hidden">
      <h1 class="admin-title">Admin dashboard</h1>

      <div class="admin-card">
        <h2>👥 Users <span id="user-count" class="count"></span></h2>
        <div class="table-wrap">
          <table id="users-table">
            <thead><tr><th>Email</th><th>Role</th><th>Joined</th><th>Downloads</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="admin-card">
        <h2>🗂️ Download history (links only) <span id="dl-count" class="count"></span></h2>
        <div class="table-wrap">
          <table id="downloads-table">
            <thead><tr><th>User</th><th>Title</th><th>Platform</th><th>Quality</th><th>When</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
